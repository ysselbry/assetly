<div class="card card--center" data-view="forgot" hidden>
<span class="icon-circle"><svg><use href="#i-mail"/></svg></span>
<span class="step">Step 1 of 3</span>
<h2 class="card__title">Forgot password?</h2>
<p class="card__muted card__muted--small">Enter the email you registered with and we'll send you a 6-digit code to reset your password.</p>
<form id="form-forgot" class="form--left" novalidate>
  <div class="field"><label for="fp-email">Email:</label><input id="fp-email" type="email" placeholder="name@school.edu" required><p class="field__error" hidden></p></div>
  <p class="form-error" data-form-error hidden></p>
    <button type="submit" class="btn btn--primary">Send code</button>
</form>
<a href="landingPage.html#login" class="link link--back">&lsaquo; Back to log in</a>
</div>
