<div class="card card--center" data-view="reset-code" hidden>
<span class="icon-circle"><svg><use href="#i-shield"/></svg></span>
<span class="step">Step 2 of 3</span>
<h2 class="card__title">Check your email</h2>
<p class="card__muted card__muted--small">Enter the 6-digit code to continue.</p>
<p class="notice">If the email is registered, a verification code was sent. It expires in 15 minutes.</p>
<div class="otp" data-otp="reset" aria-label="6-digit code"></div>
<p class="field__error field__error--center" data-otp-error hidden></p>
<p class="timer timer--small">Code expires in <span data-expiry>15:00</span></p>
<button type="button" class="btn btn--primary" data-otp-submit>Verify code</button>
<p class="card__note">Didn't receive the code? <button type="button" class="link link--btn" data-resend disabled>Resend in <span data-resend-time>0:30</span></button></p>
<div class="divider divider--line"></div>
<p class="card__links"><a href="#forgot" class="link">Change email</a><a href="landingPage.html#login" class="link">Back to log in</a></p>
</div>
