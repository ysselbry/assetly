<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Assetly – Forgot password</title>
</head>
<body>

<!-- Icon sprite -->
<div data-include="partials/icons.html"></div>

<main class="layout layout--center">

  <a href="landingPage.html#login" class="brand"><svg><use href="#i-bank"/></svg> Assetly</a>

  <!-- ============ FORGOT PASSWORD FLOW ============
       js/forgotPassword.js shows one step at a time
       (#forgot, #reset-code, #reset-password, #reset-done).

  ================================================== -->

  <!-- Step 1 of 3: enter email -->
  <div data-include="partials/forgot/step1-email.html"></div>

  <!-- Step 2 of 3: enter 6-digit code -->
  <div data-include="partials/forgot/step2-code.html"></div>

  <!-- Step 3 of 3: set new password -->
  <div data-include="partials/forgot/step3-password.html"></div>
