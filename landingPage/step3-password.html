<div class="card card--center" data-view="reset-password" hidden>
<span class="icon-circle"><svg><use href="#i-lock"/></svg></span>
<span class="step">Step 3 of 3</span>
<h2 class="card__title">Set new password</h2>
<p class="card__muted card__muted--small">Choose a strong password you haven't used before.</p>
<form id="form-reset" class="form--left" novalidate>
  <div class="field">
    <label for="np-pass">New password:</label>
    <div class="input-wrap"><input id="np-pass" type="password" placeholder="Enter new password" required>
      <button type="button" class="eye" data-toggle-password aria-label="Show password"><svg><use href="#i-eye"/></svg></button></div>
  </div>
  <div class="field">
    <label for="np-confirm">Confirm password:</label>
    <div class="input-wrap"><input id="np-confirm" type="password" placeholder="Re-enter new password" required>
      <button type="button" class="eye" data-toggle-password aria-label="Show password"><svg><use href="#i-eye"/></svg></button></div>
    <p class="field__error" hidden></p>
  </div>
  <ul class="rules" id="pw-rules">
    <li data-rule="length">At least 8 characters</li>
    <li data-rule="number">Contains a number</li>
    <li data-rule="symbol">Contains a symbol</li>
  </ul>
  <p class="form-error" data-form-error hidden></p>
    <button type="submit" class="btn btn--primary">Save password</button>
</form>
<a href="landingPage.html#login" class="link link--back">&lsaquo; Back to log in</a>
</div>
